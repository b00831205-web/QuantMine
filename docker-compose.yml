# QUANTMINE 一键部署：postgres(pgvector) + webapi + frontend + airflow。
#   cp .env.docker.example .env   # 改密码/密钥
#   docker compose up -d          # 打开 http://localhost:8090 登录
#
# 只跑核心（不含 Airflow）：docker compose up -d postgres webapi frontend

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # 供 init.sh 建业务角色用
      QUANTMINE_WEB_PASSWORD: ${QUANTMINE_WEB_PASSWORD}
      QUANTMINE_PIPELINE_PASSWORD: ${QUANTMINE_PIPELINE_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./quantmine/storage/schema.sql:/sql/schema.sql:ro
    healthcheck:
      # 只有 init 建完 quantmine 库后才算 healthy → 下游确保表已就绪
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d quantmine"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"   # 只供本机调试，不向局域网暴露数据库

  webapi:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/webapi/Dockerfile
    environment:
      QUANTMINE_DATABASE_URL: postgresql+psycopg2://quantmine_web:${QUANTMINE_WEB_PASSWORD}@postgres:5432/quantmine
      QUANT_AIRFLOW_PG_DSN: postgresql://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__DAGS_FOLDER: /app/pipelines
      AIRFLOW_HOME: /app/airflow
      QUANT_AIRFLOW_BIN: /app/.venv/bin/airflow
      QUANT_AIRFLOW_PYTHON: /app/.venv/bin/python
      QUANT_AUTH_SECRET: ${QUANT_AUTH_SECRET}
      QUANTMINE_ADMIN_USER: ${QUANTMINE_ADMIN_USER}
      QUANTMINE_ADMIN_PASSWORD: ${QUANTMINE_ADMIN_PASSWORD}
      POSTGRES_HOST: postgres
      QUANT_AUTH_COOKIE_SECURE: "0"
    # AI provider keys reach the container through this file, not through
    # `environment:` entries. `--env-file` only feeds Compose's ${VAR}
    # substitution -- it injects nothing into a container -- so enumerating each
    # key above meant every new provider needed a compose edit, and the failure
    # mode was silent: AI Config just showed "not configured" with no hint that
    # the key was sitting in .env.docker unread.
    #
    # `required: false` keeps a fresh clone working: the file is gitignored and
    # does not exist until the operator creates it, and a missing env_file is a
    # hard error otherwise. Values here are overridden by `environment:` above,
    # so the DB URLs built from ${VAR} substitution still win.
    env_file:
      - path: .env.docker
        required: false
    volumes:
      # 回测产物（ticker_history parquet）由 airflow 容器写进 ./data，webapi 读它才能
      # 给出调仓持仓与个股贡献。不挂这一条，holdings 永远解析不到，前端只会显示
      # 一句"本期没有独立持仓"，把缺文件伪装成正常状态。
      #
      # 必须可写，不能加 :ro —— webapi 自己也往 data/ 下写三类东西：
      # data/reports（报告产物与 PDF 缓存）、data/attachments（AI 上传的附件）。
      # 挂成只读时报告生成会 500 在 OSError: Read-only file system，而错误信息
      # 只说"请稍后重试"，看不出根因。
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      # 8090 而非 8080：8080 是 Airflow 自己的默认端口，也是 Tomcat/Jenkins 的，
      # 在装过其中任何一个的机器上都会被占。本项目自带 Airflow，把前端放 8080
      # 等于跟自己的调度器抢，且失败方式很隐蔽——端口被占时容器照常 Running，
      # 只是映射悄悄丢失，浏览器打到的是另一个服务。
      - "127.0.0.1:8090:80"
    depends_on:
      - webapi

  airflow:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /app/pipelines
      QUANT_PROJECT_ROOT: /app
      QUANT_PYTHON_BIN: python
      QUANT_CONFIG_PATH: config.example.yaml
      QUANTMINE_DATABASE_URL: postgresql+psycopg2://quantmine_pipeline:${QUANTMINE_PIPELINE_PASSWORD}@postgres:5432/quantmine
      QUANTMINE_PIPELINE_DATABASE_URL: postgresql+psycopg2://quantmine_pipeline:${QUANTMINE_PIPELINE_PASSWORD}@postgres:5432/quantmine
    volumes:
      - ./pipelines:/app/pipelines:ro
      - ./config.example.yaml:/app/config.example.yaml:ro
      - ./data:/app/data
      - ./tmp:/app/tmp
      - airflow-logs:/opt/airflow/logs
    ports:
      - "127.0.0.1:8091:8080"   # Airflow 自带 UI，仅绑定本机；8081 同理是最常见的“备用端口”
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  airflow-logs:

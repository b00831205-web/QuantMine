# quantmine example config -- copy to config.yaml and adjust as needed.
# Every key and field is optional; omitted values fall back to the defaults
# (which are the values annotated below).

data_acquisition:
  checkpoint_dir: tmp/checkpoint
  max_retries: 3
  wait: 60                  # seconds to wait before retrying a failed batch download

momentum:
  day: 5                    # momentum lookback in days (5 = 5-day momentum)

forward_return:
  periods: [1, 5, 20]       # holding periods in trading days

newey_west:
  lag_multiplier: 2         # NW lag = lag_multiplier * (holding period - 1)

orthogonalize:
  threshold: 0.03           # factors with average |IR| below this are dropped
  min_period: 60            # minimum window for the expanding beta estimate

time_series_stationary_test:
  rolling_period: 126       # rolling IC window (~half a year)
  periods: [1, 5, 20]       # ACF lags

ic_research:
  train_end: "2023-12-31"
  test_start: "2024-02-01"
  periods: [1, 5, 20]
  processors:
    - id: orthogonalized
      name: orthogonalize
      input: raw
      params:
        periods: [1, 5, 20]
  tests:
    - id: newey_raw
      name: newey_test
      input: raw
      params:
        lag_multiplier: 2
    - id: newey_orthogonalized
      name: newey_test
      input: orthogonalized
      params:
        lag_multiplier: 2

backtest:
  jobs:
    - id: raw_quintile
      variant: raw
      selection_test: newey_raw
      part: 5
      cost_per_trade: 0.001
      selector:
        name: bh
        params: {}
      sensitivity:
        enabled: false
        random_seed: 42

    - id: orthogonalized_quintile
      variant: orthogonalized
      selection_test: newey_orthogonalized
      part: 5
      cost_per_trade: 0.001
      selector:
        name: bh
        params: {}
      sensitivity:
        enabled: false
        random_seed: 42

    # Same factors and selection as the job above, weighted by market cap
    # instead of equally. Equal weighting quietly tilts a portfolio towards the
    # smallest names in each bucket, so a factor can look profitable on a book
    # nobody could actually run; comparing the two jobs shows how much of the
    # result survives at realistic position sizes.
    # Falls back to equal weighting on dates where no member has a positive
    # market cap, so early windows degrade instead of producing NaN.
    - id: mcap_quintile
      variant: orthogonalized
      selection_test: newey_orthogonalized
      part: 5
      cost_per_trade: 0.001
      weighting:
        name: mcap
        params: {}
      selector:
        name: bh
        params: {}
      sensitivity:
        enabled: false
        random_seed: 42

carhart_attribution:
  maxlags: 20               # maximum lag for HAC standard errors

a_share_daily_pipeline: &a_share_daily_pipeline
  schema_version: 1
  raw_connection_ref: cn_raw
  reference_binding:
    connection_ref: cn_reference
    dataset: cn_a_share_reference
    market: CN
    version: "{as_of_date}"
  status_binding:
    connection_ref: cn_status
    dataset: cn_a_share_status
    market: CN
    version: "history_v1"
  eligibility_binding:
    connection_ref: cn_eligibility
    dataset: cn_a_share_eligibility
    market: CN
    version: "{as_of_date}"
  eligibility_rule_version: cn_equity_v1
  spot_coverage:
    max_missing_count: 5
    max_missing_ratio: 0.001

a_share_daily_market_data_refresh: &a_share_daily_market_data_refresh
  schema_version: 1

  source:
    entry_point: quantmine.plugins.akshare:create_akshare_a_stock_data_source
    params:
      default_adjustment: hfq

  binding:
    connection_ref: null
    dataset: akshare_a_share_history
    start: "{as_of_date}"
    end: "{as_of_date}"
    adjustment: hfq
    metadata: {}

  reference_binding:
    connection_ref: cn_reference
    dataset: cn_a_share_reference
    market: CN
    version: "{as_of_date}"

  output_connection_ref: cn_market_data

  publication:
    dataset_id: cn_a_share_daily_bars
    market: CN
    version: "{as_of_date}"
    source: akshare_stock_zh_a_hist
    frequency: daily
    adjustment: hfq
    schema_version: market_data_bundle_v1

  policy:
    batch_size: 50
    max_retries: 3
    checkpoint_connection_ref: cn_market_checkpoint
    resume: true

market_pipelines:
  - schema_version: 1
    id: cn_a_share_daily
    dag_id: quantmine_cn_a_share_daily
    display_name: Daily A-share raw, status, and eligibility production
    schedule: "0 18 * * 1-5"

    connection_refs:
      - cn_raw
      - cn_reference
      - cn_status
      - cn_eligibility
      - cn_market_data
      - cn_market_checkpoint
    stages:
      - id: session_gate
        kind: session_gate
        plugin:
          entry_point: quantmine.plugins.market_stages:create_exchange_calendar_session_gate
          params:
            calendar_name: XSHG

      - id: reference_refresh
        kind: task
        upstream:
          - session_gate
        plugin:
          entry_point: quantmine.plugins.market_stages:create_a_share_reference_refresh
          params:
            config: *a_share_daily_pipeline
      
      - id: daily_production
        kind: task
        upstream:
          - reference_refresh
        plugin:
          entry_point: quantmine.plugins.market_stages:create_a_share_daily_production
          params:
            config: *a_share_daily_pipeline

      - id: market_data_refresh
        kind: task
        upstream:
          - daily_production
        plugin:
          entry_point: quantmine.plugins.market_stages:create_a_share_cumulative_market_data_refresh
          params:
            config: *a_share_daily_market_data_refresh
    metadata:
      market: CN
      frequency: daily
      purpose: production

a_share_history_refresh:
  schema_version: 2

  source:
    entry_point: quantmine.plugins.akshare:create_akshare_a_stock_data_source
    params:
      default_adjustment: hfq

  binding:
    connection_ref: null
    dataset: akshare_a_share_history
    start: "2020-01-01"
    end: "2026-09-10"
    adjustment: hfq
    metadata: {}

  reference_binding:
    connection_ref: cn_reference
    dataset: cn_a_share_reference
    market: CN
    version: "20260910"

  output_connection_ref: cn_market_data

  publication:
    dataset_id: cn_a_share_daily_bars
    market: CN
    version: "20260910"
    source: akshare_stock_zh_a_hist
    frequency: daily
    adjustment: hfq
    schema_version: market_data_bundle_v1

  policy:
    batch_size: 50
    max_retries: 3
    checkpoint_connection_ref: cn_market_checkpoint
    resume: true